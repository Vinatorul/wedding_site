<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e2d9d6" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Твои задания — Саша + Соня</title>
    <link
      rel="preload"
      href="/assets/CCZoinks-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/assets/heart.svg" />
    <link rel="stylesheet" href="/styles.css?v=20261015-no-rsvp" />
    <link rel="stylesheet" href="/tasks/styles.css?v=20261016-tasks-buttons" />
    <script src="/tasks/tasks.js?v=20261016-tasks-done" defer></script>
  </head>
  <body>
    <div class="page-shell tasks-shell">
      <main class="tasks-main" id="tasks-main" aria-busy="true">
        <div class="tasks-heading">
          <h1>Твои задания</h1>
        </div>
        <section
          class="tasks-intro"
          id="tasks-intro"
          aria-label="Получить задания"
        >
          <button
            class="button button-accent tasks-get"
            id="get-tasks"
            type="button"
            disabled
          >
            Получить задания
          </button>
        </section>
        <section
          class="tasks-checklist"
          id="tasks-checklist"
          aria-label="Задания"
          hidden
        >
          <ul class="tasks-list" id="tasks-list"></ul>
        </section>
        <div class="tasks-feedback" hidden>
          <p
            class="tasks-status"
            id="tasks-status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
          <button class="tasks-retry" id="retry-tasks" type="button" hidden>
            Попробовать ещё раз
          </button>
        </div>
        <noscript>
          <p class="tasks-noscript">
            Чтобы получить задания и отмечать выполненное, нужно включить
            JavaScript в браузере.
          </p>
        </noscript>
      </main>
    </div>
    <template id="task-template">
      <li class="task-item">
        <div class="task-text">
          <span class="task-optional" hidden>Необязательное</span>
          <span class="task-description"></span>
        </div>
        <button class="task-action" type="button" data-task-action>
          Готово
        </button>
      </li>
    </template>
  </body>
</html>
